<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="form-card">

            <h1>Student Registration Form</h1>
            <p class="subtitle">
                Please fill in all the details to register.
            </p>

            <form id="registrationForm" novalidate>

                <div class="form-group">
                    <label for="name">
                        Full Name <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                    >

                    <small class="error" id="nameError"></small>
                </div>

                <div class="form-group">
                    <label for="email">
                        Email Address <span class="required">*</span>
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@gmail.com"
                        autocomplete="email"
                    >

                    <small class="error" id="emailError"></small>
                </div>

                <div class="form-group">
                    <label for="mobile">
                        Mobile Number <span class="required">*</span>
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        name="mobile"
                        placeholder="Enter 10-digit mobile number"
                        maxlength="10"
                        inputmode="numeric"
                        autocomplete="tel"
                    >

                    <small class="error" id="mobileError"></small>
                </div>

                <div class="form-group">
                    <label for="password">
                        Password <span class="required">*</span>
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a strong password"
                        autocomplete="new-password"
                    >
                    <div class="strength-container">
                        <div class="strength-bar">
                            <div id="strengthBar"></div>
                        </div>

                        <span id="strengthText">
                            Password strength: Not entered
                        </span>
                    </div>

                    <small class="hint">
                        Use at least 8 characters with uppercase, lowercase,
                        number and special character.
                    </small>

                    <small class="error" id="passwordError"></small>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">
                        Confirm Password <span class="required">*</span>
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Re-enter your password"
                        autocomplete="new-password"
                    >

                    <small class="error" id="confirmPasswordError"></small>
                </div>
                <div class="form-group">
                    <label for="course">
                        Course <span class="required">*</span>
                    </label>

                    <select id="course" name="course">
                        <option value="">-- Select Course --</option>
                        <option value="BCA">BCA</option>
                        <option value="BBA">BBA</option>
                        <option value="B.Tech">B.Tech</option>
                        <option value="B.Sc">B.Sc</option>
                        <option value="B.Com">B.Com</option>
                        <option value="MCA">MCA</option>
                    </select>

                    <small class="error" id="courseError"></small>
                </div>
                <div class="form-group">
                    <label for="year">
                        Year <span class="required">*</span>
                    </label>

                    <select id="year" name="year">
                        <option value="">-- Select Year --</option>
                        <option value="First Year">First Year</option>
                        <option value="Second Year">Second Year</option>
                        <option value="Third Year">Third Year</option>
                        <option value="Fourth Year">Fourth Year</option>
                    </select>

                    <small class="error" id="yearError"></small>
                </div>
                <fieldset class="form-group">
                    <legend>
                        Gender <span class="required">*</span>
                    </legend>

                    <div class="radio-group">

                        <label class="radio-label">
                            <input
                                type="radio"
                                name="gender"
                                value="Male"
                            >
                            Male
                        </label>

                        <label class="radio-label">
                            <input
                                type="radio"
                                name="gender"
                                value="Female"
                            >
                            Female
                        </label>

                        <label class="radio-label">
                            <input
                                type="radio"
                                name="gender"
                                value="Other"
                            >
                            Other
                        </label>

                    </div>

                    <small class="error" id="genderError"></small>
                </fieldset>

                <div class="form-group terms-group">

                    <label class="checkbox-label">

                        <input
                            type="checkbox"
                            id="terms"
                            name="terms"
                        >

                        <span>
                            I agree to the
                            <a href="#" onclick="return false;">
                                Terms and Conditions
                            </a>
                            <span class="required">*</span>
                        </span>

                    </label>

                    <small class="error" id="termsError"></small>

                </div>
                <button type="submit" class="submit-btn">
                    Register Student
                </button>
                <button type="reset" class="reset-btn">
                    Reset Form
                </button>
                <div
                    id="successMessage"
                    class="success-message"
                    role="alert"
                    aria-live="polite"
                ></div>

            </form>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
