<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Data Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <div class="header-content">

            <div>
                <h1>Student Data Management System</h1>
                <p>Practical 6 - JSON, Fetch API and JavaScript</p>
            </div>

        </div>

    </header>

    <main class="container">

        <section class="card">

            <h2>Select Data</h2>

            <div class="data-buttons">

                <button class="data-btn active" data-type="students">
                    Students
                </button>

                <button class="data-btn" data-type="events">
                    Events
                </button>

                <button class="data-btn" data-type="faqs">
                    FAQs
                </button>

            </div>

        </section>

        <section class="card">

            <h2>Search, Filter & Sort</h2>

            <div class="controls">

                <div class="control-group">

                    <label for="searchInput">
                        Search
                    </label>

                    <input type="search" id="searchInput" placeholder="Search records...">

                </div>

                <div class="control-group">

                    <label for="filterSelect">
                        Filter
                    </label>

                    <select id="filterSelect">

                        <option value="all">
                            All Records
                        </option>

                    </select>

                </div>

                <div class="control-group">

                    <label for="sortSelect">
                        Sort By
                    </label>

                    <select id="sortSelect">

                        <option value="default">
                            Default
                        </option>

                        <option value="asc">
                            A → Z
                        </option>

                        <option value="desc">
                            Z → A
                        </option>

                    </select>

                </div>

            </div>


            <button id="resetBtn" class="reset-btn">
                Reset Search & Filters
            </button>

        </section>

        <section class="status-section">

            <div id="loadingMessage" class="message loading">
                Loading data...
            </div>


            <div id="errorMessage" class="message error-message">
            </div>


            <div id="successMessage" class="message success-message">
            </div>

        </section>

        <section class="info-bar">

            <div>
                <strong>Current Data:</strong>
                <span id="currentData">Students</span>
            </div>

            <div>
                <strong>Total Records:</strong>
                <span id="totalRecords">0</span>
            </div>

            <div>
                <strong>Displayed:</strong>
                <span id="displayedRecords">0</span>
            </div>

        </section>

        <section id="dataContainer" class="data-container">
        </section>

        <section class="pagination-section">

            <button id="previousBtn" class="page-btn">
                ← Previous
            </button>

            <div id="pageNumbers" class="page-numbers">
            </div>

            <button id="nextBtn" class="page-btn">
                Next →
            </button>

        </section>
    </main>

    <footer class="footer">

        <p>
            Practical 6 | JSON + Fetch API + Dynamic Rendering
        </p>

    </footer>

    <script type="module" src="js/app.js">
    </script>

</body>

</html>
